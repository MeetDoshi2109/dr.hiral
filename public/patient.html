<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Patient Portal — Dr. Hiral</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
tailwind.config = {
    darkMode: 'class',
    theme: {
        extend: {
            colors: {
                'surface-container-highest': '#273647', 'background': '#051424', 'on-surface-variant': '#bcc9c6',
                'primary-container': '#29a195', 'primary-fixed': '#89f5e7', 'on-primary': '#003732',
                'on-background': '#d4e4fa', 'surface-variant': '#273647', 'primary': '#6bd8cb',
                'inverse-surface': '#d4e4fa', 'surface-container': '#122131', 'surface': '#051424',
                'secondary': '#d2bbff', 'surface-dim': '#051424', 'outline-variant': '#3d4947',
                'inverse-on-surface': '#233143', 'on-surface': '#d4e4fa', 'error': '#ffb4ab',
                'secondary-container': '#6001d1', 'outline': '#879391', 'text-muted': '#8c90a4', 'text-secondary': '#bcc9c6', 'glass-border': 'rgba(255,255,255,0.2)'
            },
            borderRadius: { DEFAULT: '0.25rem', lg: '0.5rem', xl: '0.75rem', full: '9999px' },
            spacing: { xxl: '80px', xl: '40px', xs: '4px', sm: '8px', margin: '32px', unit: '4px', md: '16px', lg: '24px', gutter: '24px' },
            fontFamily: { 'label-caps': ['Inter'], h1: ['Manrope'], 'body-md': ['Inter'], 'body-lg': ['Inter'], h2: ['Manrope'], h3: ['Manrope'] },
            fontSize: {
                'label-caps': ['12px', { lineHeight: '1', letterSpacing: '0.1em', fontWeight: '600' }],
                h1: ['48px', { lineHeight: '1.2', letterSpacing: '-0.02em', fontWeight: '700' }],
                'body-md': ['16px', { lineHeight: '1.6', letterSpacing: '0', fontWeight: '400' }],
                'body-lg': ['18px', { lineHeight: '1.6', letterSpacing: '0', fontWeight: '400' }],
                h2: ['32px', { lineHeight: '1.3', letterSpacing: '-0.01em', fontWeight: '600' }],
                h3: ['24px', { lineHeight: '1.4', letterSpacing: '0', fontWeight: '600' }]
            }
        }
    }
};
</script>
<link rel="stylesheet" href="/css/global.css"/><link rel="stylesheet" href="/css/effects.css"/>
<style>
#mobile-menu { transition: transform 0.3s ease-in-out; }
.portal-wrap{min-height:100vh;padding:85px 2rem 2rem;max-width:900px;margin:0 auto}
.lookup-box{max-width:500px;margin:0 auto;text-align:center;padding:3rem 0}
.patient-header{display:flex;align-items:center;gap:1.5rem;margin-bottom:2rem;flex-wrap:wrap}
.patient-avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;font-size:2rem;flex-shrink:0;animation:glowPulse 3s ease-in-out infinite}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.5rem}
.info-item{padding:1rem;background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius-md);transition:all 0.3s ease}
.info-item:hover{border-color:rgba(13,148,136,0.4);transform:translateY(-3px)}
.info-item .label{font-size:0.72rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em}
.info-item .value{font-size:1rem;margin-top:0.2rem}
.timeline-item{position:relative;padding-left:2rem;padding-bottom:1.5rem;border-left:2px solid rgba(13,148,136,0.3)}
.timeline-item::before{content:'';position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--primary);box-shadow:0 0 10px var(--primary)}
.timeline-item:last-child{border-left-color:transparent}
.rx-card{padding:1.25rem;background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius-lg);margin-bottom:1rem;transition:all 0.3s ease}
.rx-card:hover{border-color:rgba(124,58,237,0.4);transform:translateY(-3px)}
@media(max-width:768px){.info-grid{grid-template-columns:1fr}}
<body class="bg-background text-on-background min-h-screen relative overflow-x-hidden">
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-gutter py-md max-w-7xl mx-auto docked full-width top-0 pointer-events-none">
    <div class="w-full mx-auto bg-surface/10 backdrop-blur-xl border border-white/20 shadow-sm backdrop-saturate-150 rounded-full flex justify-between items-center px-lg py-md md:py-sm pointer-events-auto">
        <a class="font-h3 text-h3 font-bold tracking-tight text-on-surface flex items-center gap-sm" href="/">
            <span class="material-symbols-outlined text-primary text-[28px]" style="font-variation-settings: 'FILL' 1;">spa</span> Dr. Hiral
        </a>
        <nav class="hidden md:flex items-center gap-margin font-h3 text-h3 md:font-body-md md:text-body-md">
            <a class="text-on-surface-variant hover:text-primary transition-colors hover:bg-white/5 hover:backdrop-blur-lg duration-300 px-sm py-xs rounded-lg" href="/">Home</a>
            <a class="text-on-surface-variant hover:text-primary transition-colors hover:bg-white/5 hover:backdrop-blur-lg duration-300 px-sm py-xs rounded-lg" href="/appointments.html">Book Appointment</a>
            <a class="text-primary font-bold border-b-2 border-primary pb-1 flex items-center gap-xs" href="/patient.html">Patient Portal</a>
        </nav>
        <div class="flex items-center gap-md">
            <a href="/dashboard.html" class="hidden md:flex items-center justify-center bg-gradient-to-r from-primary-container to-secondary-container text-white px-lg py-sm rounded-full font-label-caps text-label-caps uppercase tracking-wider hover:shadow-[0_0_15px_rgba(41,161,149,0.5)] transition-all duration-300 border border-white/10">Doctor Login</a>
            <button id="mobile-menu-open" class="md:hidden text-on-surface p-sm rounded-full hover:bg-white/10 transition-colors pointer-events-auto"><span class="material-symbols-outlined">menu</span></button>
        </div>
    </div>
</header>
<div class="fixed inset-0 z-[100] bg-background/95 backdrop-blur-3xl transform translate-x-full transition-transform duration-300 flex flex-col pt-[100px] px-margin pb-margin border-l border-white/10" id="mobile-menu">
    <div class="absolute top-margin right-margin"><button id="mobile-menu-close" class="text-on-surface-variant hover:text-primary transition-colors duration-300 p-sm rounded-full focus:outline-none"><span class="material-symbols-outlined text-[28px]">close</span></button></div>
    <ul class="flex flex-col gap-lg mt-xl">
        <li><a class="flex items-center gap-md font-h3 text-h3 text-on-surface-variant hover:text-primary hover:pl-md transition-all duration-300 py-sm" href="/"><span class="material-symbols-outlined">home</span>Home</a></li>
        <li><a class="flex items-center gap-md font-h3 text-h3 text-on-surface-variant hover:text-primary hover:pl-md transition-all duration-300 py-sm" href="/appointments.html"><span class="material-symbols-outlined">calendar_month</span>Book Appointment</a></li>
        <li><a class="flex items-center gap-md font-h3 text-h3 text-primary border-l-4 border-primary pl-md py-sm bg-surface-container/20" href="/patient.html"><span class="material-symbols-outlined">person</span>Patient Portal</a></li>
    </ul>
    <div class="mt-auto pt-xl border-t border-white/10"><a href="/dashboard.html" class="w-full py-md px-lg rounded-full bg-gradient-to-r from-primary to-secondary text-on-primary font-label-caps text-label-caps shadow-[0_0_15px_rgba(107,216,203,0.3)] hover:shadow-[0_0_25px_rgba(107,216,203,0.5)] transition-all flex justify-center items-center gap-sm"><span class="material-symbols-outlined text-[18px]">lock</span> Doctor Login</a></div>
</div>

<div class="portal-wrap">
<div id="lookupView" class="lookup-box animate-fadeIn">
<div style="font-size:4rem;margin-bottom:1rem">🔍</div>
<h1 style="font-size:1.8rem;margin-bottom:0.5rem">Patient <span class="highlight">Portal</span></h1>
<p class="text-secondary mb-lg">Enter your Patient ID to view your records from <strong class="highlight">Dr. Hiral</strong></p>
<div class="form-group"><input class="form-input" id="pidInput" placeholder="e.g. PAT-DEMO001" style="text-align:center;font-size:1.1rem"/></div>
<button class="btn btn-primary btn-lg w-full" onclick="lookupPatient()">View My Records</button>
<p class="text-muted text-sm mt-md">Or scan your QR code to open this page directly</p>
</div>
<div id="patientView" class="hidden"></div>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="/js/api.js"></script><script src="/js/scroll.js"></script>
<script>
const params=new URLSearchParams(location.search);
if(params.get('pid')){document.getElementById('pidInput').value=params.get('pid');lookupPatient()}
async function lookupPatient(){const id=document.getElementById('pidInput').value.trim();if(!id){toast('Enter a Patient ID','warning');return}
try{const p=await API.getPatient(id);renderPatient(p)}catch(e){toast('Patient not found — check your ID','error')}}
function renderPatient(p){document.getElementById('lookupView').classList.add('hidden');const v=document.getElementById('patientView');v.classList.remove('hidden');
let h=`<div class="patient-header reveal"><div class="patient-avatar">👤</div><div><h1 style="font-size:1.6rem">${p.name}</h1><span class="badge badge-primary">${p.id}</span> <span class="badge badge-info">Patient of Dr. Hiral</span><p class="text-secondary text-sm mt-sm">Last visit: ${fmtDate(p.last_visit)}</p></div></div>`;
h+=`<div class="info-grid stagger-children">`;
const fields=[['Age',p.age||'—'],['Gender',p.gender||'—'],['Blood Group',p.blood_group||'—'],['Phone',p.phone||'—'],['Email',p.email||'—'],['Chief Complaint',p.chief_complaint||'—']];
fields.forEach(([l,v])=>h+=`<div class="info-item"><div class="label">${l}</div><div class="value">${v}</div></div>`);
h+=`</div>`;
if(p.history){h+=`<div class="glass-card p-lg mb-lg reveal"><h3 style="font-size:1rem;margin-bottom:0.5rem">📋 Medical History</h3><p class="text-secondary text-sm">${p.history}</p></div>`}
if(p.notes){h+=`<div class="glass-card p-lg mb-lg reveal"><h3 style="font-size:1rem;margin-bottom:0.5rem">📝 Notes by Dr. Hiral</h3><p class="text-secondary text-sm">${p.notes}</p></div>`}
if(p.timeline&&p.timeline.length){h+=`<div class="reveal"><h3 style="font-size:1.1rem;margin-bottom:1rem">🕐 Treatment Timeline</h3>`;
p.timeline.forEach(t=>{h+=`<div class="timeline-item"><div class="flex justify-between items-center mb-sm"><span class="badge badge-primary">${t.remedy||''} ${t.potency||''}</span><span class="text-muted text-xs">${fmtDate(t.visit_date)}</span></div><p class="text-sm text-secondary">${t.note||''}</p></div>`});
h+=`</div>`}
if(p.prescriptions&&p.prescriptions.length){h+=`<div class="reveal mt-lg"><h3 style="font-size:1.1rem;margin-bottom:1rem">💊 Transport & Dispensation</h3>`;
p.prescriptions.forEach(rx=>{
    h+=`<div class="rx-card"><div class="flex justify-between items-center mb-sm"><span class="text-sm">Issued: ${fmtDate(rx.issued_at)}</span>${rx.follow_up?`<span class="badge badge-warning">Follow-up: ${fmtDate(rx.follow_up)}</span>`:''}</div>`;
    h+=`<div class="text-sm text-on-surface-variant"><span class="material-symbols-outlined text-[16px] align-middle">local_shipping</span> <strong>Status:</strong> ${rx.transport_status || 'Dispensed at Clinic / Sent for Transport'}</div>`;
    h+=`<div class="mt-md pt-sm border-t border-glass-border flex gap-sm">
            <a href="mailto:dr.hiral@homeocare.in?subject=Reorder%20Medicines%20for%20${p.id}" class="btn btn-sm" style="background:var(--primary);color:var(--background);font-weight:600">Reorder Medicines</a>
            <a href="mailto:dr.hiral@homeocare.in?subject=Question%20about%20Medicines%20${p.id}" class="btn btn-sm btn-outline">Contact Clinic</a>
        </div></div>`;
});
h+=`</div>`}
h+=`<div class="text-center mt-xl"><button class="btn btn-outline" onclick="location.reload()">← Look Up Another Patient</button></div>`;
v.innerHTML=h;setTimeout(()=>initScrollReveal(),100)}
</script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const openBtn = document.getElementById('mobile-menu-open');
    const closeBtn = document.getElementById('mobile-menu-close');
    const menu = document.getElementById('mobile-menu');
    if(openBtn && closeBtn && menu) {
        openBtn.addEventListener('click', () => menu.classList.remove('translate-x-full'));
        closeBtn.addEventListener('click', () => menu.classList.add('translate-x-full'));
    }
});
</script>
</body></html>
